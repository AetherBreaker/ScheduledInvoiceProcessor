services:

  scheduled-invoice-processor:
    container_name: scheduled-invoice-processor
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        GIT_TAG: v4.1.5
        GIT_REPO: https://github.com/AetherBreaker/ScheduledInvoiceProcessor.git
    restart: no
    # Shutdown = aeth_ext callbacks (<=7 s) + join of in-flight FTP threads (~5 s per vendor transfer)
    # + atexit queue save. Docker's default 10 s can SIGKILL during the join and lose the final save.
    stop_grace_period: 30s
    volumes:
      - type: bind
        source: /data/scheduled_invoice_processor_files
        target: /app/persisted_data
    environment:
      # - DATABASE_ID=15D6mO0PSfwKd5MeeycV2tP7FATOF0OfpJDNgygQ9NL0
      - DATABASE_BASE_SCHEDULE_ID=184714754
      - DATABASE_ORDER_LOG_ID=850759335
      - DATABASE_REFRESH_INTERVAL=3600
      - DATABASE_WRITE_INTERVAL=30
      - ALERTS_EMAIL=info@sweetfiretobacco.com
      - ALERTS_EMAIL_PWD=${ALERTS_EMAIL_PWD:?}
      - ALERTS_RECIPIENTS=["jacob.ogden@sweetfiretobacco.com"]
      - HEARTBEAT_SLUG=scheduled-invoice-processor
    networks:
      - coolify
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/devkit-container
        - healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  coolify:
    external: true
