[project]
  name            = "scheduled-invoice-processor"
  version         = "2.1.2"
  requires-python = ">=3.14"
  dependencies    = [
    "aeth-ext[sftp, async]>=4.2.2",
    "aiohttp>=3.13.5",
    "aiologic>=0.16.0",
    "aiorwlock>=1.5.1",
    "apscheduler>=3.11.2",
    "gspread>=6.2.1",
    "pandas[performance]>=3.0.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.1",
    "python-dateutil>=2.9.0",
    "rich>=15.0.0",
    "tzdata>=2026.2",
  ]

  [project.scripts]
    run-app-scheduled-invoice-processor = "scheduled_invoice_processor.__main__:run_app"

[dependency-groups]
  dev = [
    "apscheduler-stubs>=0.1.0.dev2",
    "mypy>=2.1.0",
    "pandas-stubs>=3.0.0.260204",
    "poe-tasks>=4.0.0",
    "poethepoet>=0.46.0",
    "pytest>=9.0.3",
    "types-python-dateutil>=2.9.0.20260323",
  ]

[build-system]
  requires      = [
    "uv_build>=0.11.2,<0.12.0",
  ]
  build-backend = "uv_build"

[tool.coverage.run]
  data_file   = ".cache/.coverage"
  source_pkgs = ["scheduled_invoice_processor"]

[tool.coverage.report]
  show_missing = true

[tool.docker]
  # Paths relative to /app that the entrypoint will chown to nonroot:nonroot.
  # Typically these are directories that will be bind-mounted as Docker volumes.
  chown_paths = [
    "persisted_data",
  ]
  mkdirs      = ["file_holding"]

[tool.poe]
  include_script = "poe_tasks:tasks"

  [tool.poe.tasks.sync]
    help  = "Sync venv and ensure this project's scripts win over same-named dependency scripts"
    shell = "uv sync && uv sync --reinstall-package scheduled-invoice-processor"

[tool.pyright]
  extends = "../pyproject.toml"

[tool.pytest.ini_options]
  addopts      = [
    "--cov",
    "--cov-report=term-missing",
    "--strict-markers",
    "--strict-config",
    "-ra"
  ]
  cache_dir    = ".cache/pytest"
  testpaths    = ["tests"]
  xfail_strict = true
  asyncio_mode = "auto"

[tool.ruff]
  extend    = "../pyproject.toml"
  cache-dir = ".cache/ruff"

  src = ["./src"]

  [tool.ruff.lint.flake8-type-checking]
    runtime-evaluated-base-classes = [
      "scheduled_invoice_processor.suppliers.file_register_data.FileRegisterData",
      "pydantic.dataclasses.dataclass",
      "pydantic._internal._dataclasses.PydanticDataclass",
      "scheduled_invoice_processor.suppliers.file_register_data.FixRuffTC001",
    ]

[tool.uv]
  environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
  ]

  [tool.uv.sources]
    aeth-ext  = [
      # { index = "SFTPyPI" },
      { index = "SFTPyPI", marker = "sys_platform == 'linux'" },
      { path = "../aeth_ext", editable = true, marker = "sys_platform == 'win32'" },
    ]
    poe-tasks = [
      { index = "SFTPyPI" },
      # , marker = "sys_platform == 'linux'"
      # { path = "../poe_tasks", editable = true, marker = "sys_platform == 'win32'" },
    ]

  [[tool.uv.index]]
    name        = "SFTPyPI"
    url         = "https://pypi.sweetfiretobacco.com/jacob.ogden/internal/+simple"
    publish-url = "https://pypi.sweetfiretobacco.com/jacob.ogden/internal/"
    explicit    = true
