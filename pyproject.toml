[project]
  name            = "scheduledinvoiceprocessor"
  version         = "1.2.0"
  requires-python = ">=3.14"
  dependencies    = [
    "aiohttp==3.*",
    "aiologic==0.16.*",
    "aiorwlock==1.*",
    "apscheduler==3.*",
    "gspread==6.*",
    "pandas[performance]==3.*",
    "paramiko==5.*",
    "pydantic==2.*",
    "pydantic-settings==2.*",
    "python-dateutil==2.9.*",
    "rich==15.*",
    "sft-ext==1.0.0",
    "tzdata>=2025.3",
    "uvloop>=0.22.1 ; sys_platform == 'linux'",
    "winloop>=0.6.0 ; sys_platform == 'win32'",
  ]

[dependency-groups]
  dev = [
    "apscheduler-stubs>=0.1.0.dev2",
    "mypy>=2.1.0",
    "pandas-stubs>=3.0.0.260204",
    "types-python-dateutil>=2.9.0.20260323",
  ]

[tool.poe.tasks.bump]
  help        = "Bump version, commit, tag, and push. Usage: poe bump [major|minor|patch]"
  interpreter = "bash"
  shell       = """
    set -e
    NEW_VERSION=$(uv version --bump "${bump_type}" | awk '{print $NF}')
    git add pyproject.toml uv.lock
    git commit -m "Bump version to ${NEW_VERSION}"
    git tag -a "v${NEW_VERSION}" -m "Version ${NEW_VERSION}"
    git push --follow-tags
  """

  [[tool.poe.tasks.bump.args]]
    name       = "bump_type"
    positional = true
    help       = "Version component to bump: major, minor, or patch"

[tool.pyright]
  extends = "../pyproject.toml"

[tool.ruff]
  extend = "../pyproject.toml"

  src = [
    "./src",
  ]

[tool.uv]
  environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
  ]

  [tool.uv.sources]
    sft-ext = [
      { git = "https://github.com/AetherBreaker/sft_ext", marker = "sys_platform == 'linux'", tag = "v1.0.0" },
      { path = "D:\\SFT Software Projects\\sft_ext", editable = true, marker = "sys_platform == 'win32'" },
    ]
