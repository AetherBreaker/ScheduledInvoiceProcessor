[project]
  name            = "scheduled-invoice-processor"
  version         = "4.0.2"
  requires-python = ">=3.14"
  dependencies    = [
    "aeth-ext[sftp, async]>=8.0.8",
    "aiohttp>=3.13.5",
    "aiologic>=0.16.0",
    "aiorwlock>=1.5.1",
    "apscheduler>=3.11.2",
    "gspread>=6.2.1",
    "orjson>=3.10.0",
    "pandas[performance]>=3.0.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.1",
    "python-dateutil>=2.9.0",
    "rich>=15.0.0",
    "tzdata>=2026.2",
  ]

  [project.scripts]
    run-app-scheduled-invoice-processor = "scheduled_invoice_processor.__main__:run_app"

[dependency-groups]
  dev = [
    "aeth-devkit>=8.2.0",
    "apscheduler-stubs>=0.1.0.dev2",
    "mypy>=2.1.0",
    "pandas-stubs>=3.0.0.260204",
    "poethepoet>=0.46.0",
    "pyright>=1.1.411",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.15",
    "tombi>=1.5",
    "types-python-dateutil>=2.9.0.20260323",
  ]                                           # setup-project added: "pytest>=8.0" (was pytest>=9.0.3), "pytest-asyncio>=0.24" (was pytest-asyncio>=1.0.0), "pytest-cov>=5.0" (was pytest-cov>=6.0.0), "ruff>=0.15", "tombi>=1.5"

[build-system]
  requires      = [
    "uv_build>=0.11.2,<0.12.0",
  ]
  build-backend = "uv_build"

[tool.coverage.run]
  data_file   = ".cache/.coverage"
  source_pkgs = ["scheduled_invoice_processor"]

[tool.coverage.report]
  show_missing = true

[tool.coverage.html]
  directory = ".cache/htmlcov"

[tool.coverage.xml]
  output = ".cache/coverage.xml"

[tool.coverage.lcov]
  output = ".cache/coverage.lcov"

[tool.docker]
  # Paths relative to /app that the entrypoint will chown to nonroot:nonroot.
  # Typically these are directories that will be bind-mounted as Docker volumes.
  chown_paths = [
    "persisted_data",
  ]
  mkdirs      = ["file_holding"]

# setup-project: if-dep mypy
[tool.mypy]
  cache_dir = ".cache/mypy"

[tool.poe]
  include_script = [
    { script = "aeth_devkit:tasks", executor = { type = "uv", frozen = true } }
  ]

[tool.pyright]
  typeCheckingMode = "standard"

  verboseOutput          = true
  useLibraryCodeForTypes = true

  enableReachabilityAnalysis  = true
  analyzeUnannotatedFunctions = true
  deprecateTypingAliases      = true

  reportPropertyTypeMismatch          = true
  reportMissingTypeStubs              = false
  reportImportCycles                  = true
  reportUntypedFunctionDecorator      = true
  reportUntypedClassDecorator         = true
  reportUntypedNamedTuple             = true
  reportPrivateUsage                  = true
  # reportConstantRedefinition          = true
  reportDeprecated                    = true
  # reportMissingSuperCall              = true
  reportUninitializedInstanceVariable = true
  reportMissingParameterType          = true
  # reportMissingTypeArgument           = true
  reportUnnecessaryIsInstance         = true
  reportUnnecessaryCast               = true
  reportUnnecessaryComparison         = true
  reportUnnecessaryContains           = true
  reportInvalidStubStatement          = true
  reportUnnecessaryTypeIgnoreComment  = true
  reportMatchNotExhaustive            = true
  reportUnreachable                   = true
  reportImplicitOverride              = true
  reportMissingTypeArgument           = false

  executionEnvironments = [{ root = "src", extraPaths = ["src"] }]

[tool.pytest.ini_options]
  addopts                            = [
    "--cov",
    "--cov-report=term-missing",
    "--strict-markers",
    "--strict-config",
    "-ra"
  ]
  cache_dir                          = ".cache/pytest"
  testpaths                          = ["tests"]
  xfail_strict                       = true
  asyncio_mode                       = "auto"
  asyncio_default_fixture_loop_scope = "session"
  asyncio_default_test_loop_scope    = "session"

[tool.ruff]
  cache-dir = ".cache/ruff"

  src = [
    "./src",
    "../*/src",
    "../*/python"
  ]                                           # setup-project added: "../*/src", "../*/python"

  exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "dist",
    "node_modules",
    "venv",
  ]

  fix = true

  indent-width = 2
  line-length  = 135

  [tool.ruff.lint]
    extend-select = [
      "A",
      "ANN001",
      "ASYNC",
      "B",
      "C4",
      "C90",
      "DTZ",
      "FBT003",
      "LOG",
      "N",
      "NPY",
      "PD",
      "PERF",
      "PL",
      "PYI",
      "RUF",
      "T10",
      "TC",
      "UP",
      "D",
      "TID",
    ]                  # setup-project added: "D", "TID"
    ignore        = [
      "A004",
      "PD008",
      "PD009",
      "PLC0415",
      "PLR0913",
      "PLW0603",
      "PIE790",
    ]

    [tool.ruff.lint.flake8-type-checking]
      runtime-evaluated-base-classes = [
        "scheduled_invoice_processor.suppliers.file_register_data.FileRegisterData",
        "pydantic.dataclasses.dataclass",
        "pydantic._internal._dataclasses.PydanticDataclass",
        "scheduled_invoice_processor.suppliers.file_register_data.FixRuffTC001",
      ]

    [tool.ruff.lint.per-file-ignores]
      "tests/**" = ["N812", "PLR2004", "FBT003"]

    [tool.ruff.lint.isort]
      combine-as-imports = true
      known-first-party  = ["scheduled_invoice_processor", "aeth_ext"]

      [tool.ruff.lint.isort.import-heading]
        first-party      = "First party imports"
        future           = "Future imports"
        local-folder     = "Local folder imports"
        standard-library = "Standard library imports"
        third-party      = "Third party imports"

    [tool.ruff.lint.flake8-tidy-imports.banned-api."__future__.annotations"]
      # Delivered by ruff exactly when violated, so the reasoning costs no context otherwise.
      msg = "Python 3.14 evaluates all annotations lazily (PEP 649) with or without this import. What it adds is PEP 563 stringification, which breaks pydantic, dataclasses.fields() introspection, and typing.get_type_hints."

    [tool.ruff.lint.pydocstyle]
      convention = "google"

  [tool.ruff.format]
    docstring-code-format = true

[tool.tombi]
  toml-version = "v1.1.0"

  [tool.tombi.files]
    exclude = [
      ".bzr",
      ".direnv",
      ".eggs",
      ".git",
      ".git-rewrite",
      ".hg",
      ".mypy_cache",
      ".nox",
      ".pants.d",
      ".pytype",
      ".ruff_cache",
      ".svn",
      ".tox",
      ".venv",
      "__pypackages__",
      "_build",
      "buck-out",
      "dist",
      "node_modules",
      "venv",
    ]

  [tool.tombi.format.rules]
    indent-sub-tables               = true
    indent-table-key-value-pairs    = true
    key-value-equals-sign-alignment = true
    trailing-comment-alignment      = true

[tool.uv]
  environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
  ]

  [tool.uv.sources]
    aeth-ext    = [
      # { index = "SFTPyPI" },
      { index = "SFTPyPI", marker = "sys_platform == 'linux'" },
      { path = "../aeth_ext", editable = true, marker = "sys_platform == 'win32'" },
    ]
    aeth-devkit = [
      { index = "SFTPyPI" },
      # , marker = "sys_platform == 'linux'"
      # { path = "../poe_tasks", editable = true, marker = "sys_platform == 'win32'" },
    ]

  [[tool.uv.index]]
    name        = "SFTPyPI"
    url         = "https://pypi.sweetfiretobacco.com/jacob.ogden/internal/+simple"
    publish-url = "https://pypi.sweetfiretobacco.com/jacob.ogden/internal/"
    explicit    = true
